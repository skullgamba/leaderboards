<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RustyWager Rewards Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-5">
        <div>
          <p class="text-xs font-bold uppercase tracking-[0.25em] text-amber-400">Prize Board</p>
          <h1 class="text-2xl font-black">Top 10 Leaderboard</h1>
        </div>
        <div class="rounded-full border border-amber-500/40 bg-amber-500/10 px-3 py-1.5 text-sm text-amber-200">
          1st = 50 • 2nd = 25 • 3rd = 15 • 4th/5th = 5
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-6xl space-y-8 px-4 py-8">
      <section class="grid gap-4 md:grid-cols-2">
        <div class="rounded-2xl border border-slate-800 bg-slate-900 p-5">
          <p class="text-sm text-slate-400">Current status</p>
          <p id="statusMessage" class="mt-3 text-xl font-bold text-amber-300">Loading leaderboard...</p>
        </div>
        <div class="rounded-2xl border border-slate-800 bg-slate-900 p-5">
          <p class="text-sm text-slate-400">Top prize</p>
          <div class="mt-3 flex items-center gap-3">
            <img id="coinPreview" alt="coin reward" class="h-10 w-10 rounded-full object-cover border border-amber-400/30 bg-slate-800" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='64' height='64'><circle cx='32' cy='32' r='30' fill='%23f59e0b'/></svg>" />
            <p class="text-2xl font-black text-amber-300">50 coins</p>
          </div>
        </div>
      </section>

      <section class="overflow-hidden rounded-2xl border border-slate-800 bg-slate-900">
        <div class="flex items-center justify-between border-b border-slate-800 px-5 py-4">
          <h2 class="text-lg font-bold">Prize leaderboard</h2>
          <span class="text-sm text-slate-400">Top 10 players</span>
        </div>

        <div class="overflow-x-auto">
          <table class="min-w-full text-left">
            <thead class="bg-slate-950 text-xs uppercase tracking-wider text-slate-400">
              <tr>
                <th class="px-5 py-3">Rank</th>
                <th class="px-5 py-3">Player</th>
                <th class="px-5 py-3 text-right">Total wagered</th>
                <th class="px-5 py-3 text-right">Prize</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody" class="divide-y divide-slate-800"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module">
      const API_BASE = 'https://rustywager.com/api/partners/leaderboard';
      const DEFAULT_COIN = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><circle cx="32" cy="32" r="30" fill="%23f59e0b"/></svg>';
      const prizeMap = {
        1: 50,
        2: 25,
        3: 15,
        4: 5,
        5: 5,
      };

      const statusMessageEl = document.getElementById('statusMessage');
      const leaderboardBody = document.getElementById('leaderboardBody');
      const coinPreview = document.getElementById('coinPreview');

      function parseApiRows(payload) {
        const candidates = [
          payload,
          payload?.data,
          payload?.rows,
          payload?.items,
          payload?.results,
          payload?.partners,
          payload?.leaderboard,
          payload?.entries
        ];

        for (const candidate of candidates) {
          if (Array.isArray(candidate)) return candidate;
        }

        return [];
      }

      function normalizeRow(entry, index) {
        const amountValue = Number(
          entry?.totalWagered ??
          entry?.wagered ??
          entry?.total ??
          entry?.amount ??
          entry?.value ??
          0
        );

        const name = entry?.playerName ?? entry?.name ?? entry?.partnerName ?? entry?.partner ?? entry?.hostname ?? entry?.creator ?? entry?.affiliateCode ?? `Player ${index + 1}`;

        return {
          rank: index + 1,
          playerName: String(name),
          totalWagered: Number.isFinite(amountValue) ? amountValue : 0
        };
      }

      function formatCurrency(value) {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(value || 0);
      }

      function getPrizeLabel(rank) {
        const prize = prizeMap[rank] ?? 0;
        if (!prize) return '—';
        return `${prize} coins`;
      }

      function renderLeaderboard(rows) {
        leaderboardBody.innerHTML = rows.slice(0, 10).map((row, index) => {
          const rank = row.rank ?? index + 1;
          const prize = getPrizeLabel(rank);
          const prizeMarkup = prize === '—'
            ? '<span class="text-slate-500">—</span>'
            : `<div class="inline-flex items-center justify-end gap-2"><img src="${DEFAULT_COIN}" class="h-6 w-6 rounded-full object-cover border border-amber-500/50" alt="coin reward" /><span class="font-semibold text-amber-300">${prize}</span></div>`;

          return `
            <tr class="hover:bg-slate-800/40">
              <td class="px-5 py-4 font-semibold text-amber-300">#${rank}</td>
              <td class="px-5 py-4">${row.playerName}</td>
              <td class="px-5 py-4 text-right font-mono text-slate-200">${formatCurrency(row.totalWagered)}</td>
              <td class="px-5 py-4 text-right">${prizeMarkup}</td>
            </tr>
          `;
        }).join('');
      }

      async function loadLeaderboard() {
        const params = new URLSearchParams({
          startDate: '2026-01-01',
          endDate: '2026-12-31',
          sort: 'wagered',
          page: '1',
          limit: '10'
        });

        const targetUrl = `${API_BASE}?${params.toString()}`;
        const corsProxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);
        
        console.debug('[Public Leaderboard] Fetching from:', corsProxyUrl);

        try {
          statusMessageEl.textContent = 'Loading live data from RustyWager...';
          const response = await fetch(corsProxyUrl);

          console.debug('[Public Leaderboard] Response status:', response.status);
          
          if (!response.ok) {
            throw new Error(`API request failed with ${response.status}`);
          }

          const payload = await response.json();
          console.debug('[Public Leaderboard] Payload:', payload);
          
          const rows = parseApiRows(payload)
            .map(normalizeRow)
            .sort((a, b) => b.totalWagered - a.totalWagered)
            .slice(0, 10);

          if (!rows.length) {
            throw new Error('No leaderboard rows returned');
          }

          statusMessageEl.textContent = 'Live leaderboard loaded successfully.';
          renderLeaderboard(rows);
        } catch (error) {
          console.warn('[Public Leaderboard] Error loading data:', error);
          statusMessageEl.textContent = 'No wagers yet. Check back soon!';
          leaderboardBody.innerHTML = '<tr><td colspan="4" class="px-5 py-8 text-center text-slate-400">Waiting for first wager...</td></tr>';
        }
      }

      loadLeaderboard();
      
      // Auto-refresh every 30 minutes
      setInterval(loadLeaderboard, 30 * 60 * 1000);
    </script>
  </body>
</html>
